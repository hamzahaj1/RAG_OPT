[tool.poetry]
name = "alpha-scope-rag"
version = "0.1.0"
description = "Pipeline RAG d'analyse de code source — cible FastAPI géométriquement régulière"
authors = ["Hamza Hajjam <hajjamhamza33@gmail.com>"]
readme = "CLAUDE.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.129.0"
sqlalchemy = "^2.0.43"
asyncpg = "^0.31.0"
bcrypt = "^5.0"
pydantic = { extras = ["email"], version = "^2.11.0" }
pydantic-settings = "^2.10.0"
uvicorn = { extras = ["standard"], version = "^0.37.0" }

[tool.poetry.group.dev.dependencies]
alembic = "^1.16.0"
httpx = "^0.28"
mypy = "^1.18.0"
pytest = "^8.4.0"
pytest-asyncio = "^1.2.0"
ruff = "^0.14.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
